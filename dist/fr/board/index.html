<main id="wrap">

    <button id="dup" data-i="dup"><span data-t="dup"></span></button>

    <button id="del" data-i="trash"><span data-t="del"></span></button>

    <button class="ib" id="undo" data-i="undo" data-tt="undo"></button>
    <button class="ib" id="redo" data-i="redo" data-tt="redo"></button>
    <i class="sep"></i>
    <button class="zb" id="zout" data-tt="zoomOut">−</button>
    <button id="zfit" data-tt="fit">100%</button>
    <button class="zb" id="zin" data-tt="zoomIn">+</button>
  </div>
  <div id="toast" class="float" role="status" hidden></div>
  <div id="boardsPop" class="float pop" hidden>

    <p data-t="boardsNote"></p>

      <button class="btn" id="bbackup" data-t="backup"></button>
      <button class="btn" id="brestore" data-t="restore"></button>

  </div>
  <div id="proPop" class="float pop" hidden>

    <a class="pill" id="buy" target="_blank" rel="noopener" hidden></a>
    <p id="soon" data-t="proSoon" hidden></p>
    <div id="keyBox">
      <label for="key" data-t="haveKey"></label>
      <div class="row"><input id="key" autocomplete="off" spellcheck="false"><button class="btn" id="act" data-t="activate"></button></div>
    </div>
    <p id="keymsg" role="status"></p>
    <div class="row"><button class="btn" id="proClose" data-t="close"></button><button class="btn" id="proOff" data-t="proOff" hidden></button></div>
