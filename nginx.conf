server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # one address for search engines: sitewhiteboard.com -> www.sitewhiteboard.com
    if ($host = "sitewhiteboard.com") {
        return 301 https://www.sitewhiteboard.com$request_uri;
    }

    # /board -> /board/ (and the same for /fr/board, /ar/board, /fr, /ar)
    location / {
        try_files $uri $uri/ =404;
    }

    # css/js are linked with ?v=..., so they can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # pages are always checked again so updates show at once
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
}
